version: '3.9'

services:
  # Next.js 应用（端口发布到宿主机回环，供 host 网络的 nginx 反代，不对公网暴露）
  scx-admin-app:
    image: scx-admin-app
    container_name: scx-admin-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    ports:
      - '127.0.0.1:3000:3000'

  # Nginx 代理（host 网络：直接监听宿主机 3369，经回环直连 app 与后端隧道口，
  # 不再依赖 docker 网络 DNS 与 host.docker.internal）
  scx-admin-nginx:
    image: nginx:stable
    container_name: scx-admin-nginx
    restart: always
    network_mode: host
    depends_on:
      - scx-admin-app
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
